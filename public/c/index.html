<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f4ec" />
  <meta name="color-scheme" content="light dark" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css" />
  <title>漫画分享 · Kira</title>
  <meta name="description" content="好故事，分享给你。在 Kira 里打开这份漫画分享。" />
  <link rel="icon" href="/logo.png" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/scrollbars.css" />
  <style>
    :root {
      --line: var(--rule);
      --wash: var(--sage);
      --serif: "Cascadia Code", "HY YouYuan", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.7;
      -webkit-text-size-adjust: 100%;
    }

    a { color: var(--accent); }
    a, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    a:focus-visible, button:focus-visible, main:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    .shell {
      width: min(100%, 1088px);
      margin-inline: auto;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }

    .skip-link {
      position: absolute;
      top: 8px;
      left: 24px;
      z-index: 1;
      min-height: 44px;
      padding: 8px 16px;
      background: var(--paper);
      border: 1px solid var(--accent);
      transform: translateY(-200%);
    }
    .skip-link:focus { transform: translateY(0); }

    .masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 24px;
      padding-block: max(16px, env(safe-area-inset-top)) 16px;
      border-bottom: 1px solid var(--ink);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      color: var(--ink);
      text-decoration: none;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
    }
    .logo { display: block; width: 36px; height: 36px; object-fit: contain; }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }
    .icon { width: 20px; height: 20px; flex: none; }

    .spread {
      display: grid;
      gap: 40px;
      padding-block: 40px;
    }
    .intro { align-self: center; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--accent); }
    h1, h2, p { margin-top: 0; }
    h1 {
      margin-bottom: 20px;
      font-family: var(--serif);
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    h1 span { display: block; }
    .lede { margin: 0; color: var(--muted); }

    .handoff {
      min-width: 0;
      padding-block: 20px 24px;
      border-top: 3px solid var(--accent);
      border-bottom: 1px solid var(--line);
    }
    .section-label {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
    }
    .link-state {
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--wash);
      color: var(--accent);
    }
    .handoff h2 { margin-bottom: 12px; font-family: var(--serif); font-size: 24px; line-height: 1.5; }
    .status { min-height: 5.1em; margin-bottom: 24px; color: var(--muted); overflow-wrap: anywhere; }
    .actions { display: grid; gap: 12px; }
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      font: inherit;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
    }
    .button-primary { background: var(--accent); color: var(--paper); }
    .button-secondary { background: transparent; color: var(--accent); }
    .button-primary:disabled {
      background: var(--wash);
      color: var(--muted);
      border-color: var(--line);
      cursor: not-allowed;
    }
    .button-primary:not(:disabled):active { background: var(--ink); border-color: var(--ink); }
    .button-secondary:active { background: var(--wash); }
    .home-route { margin-top: 16px; }

    .browser-note {
      padding: 24px;
      border-left: 2px solid var(--accent);
      background: var(--wash);
    }
    .browser-note h2 { margin-bottom: 8px; font-size: 16px; font-weight: 600; }
    .browser-note p { margin-bottom: 0; color: var(--muted); }
    .noscript-note { margin: 20px 0 0; color: var(--ink); }

    footer { margin-top: auto; }
    .colophon {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 24px;
      padding-block: 20px max(24px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .colophon p { margin: 0; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: hover) {
      .button-primary:not(:disabled):hover { background: var(--ink); border-color: var(--ink); }
      .button-secondary:hover { background: var(--wash); }
      .text-link:hover { color: var(--ink); }
    }
    @media (min-width: 768px) {
      .masthead { padding-block: 24px; }
      .spread { grid-template-columns: 1.15fr 1fr; gap: 56px 64px; padding-block: 72px 56px; }
      .browser-note { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
      .browser-note h2 { margin-bottom: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到分享内容</a>
  <header class="shell">
    <div class="masthead">
      <a class="brand" href="/" aria-label="Kira 首页">
        <img class="logo" src="/logo.png" alt="" width="36" height="36" />
        <span>Kira</span>
      </a>
      <a class="text-link" href="/">
        返回首页
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
      </a>
    </div>
  </header>

  <main class="shell" id="main" tabindex="-1">
    <div class="spread">
      <section class="intro" aria-labelledby="share-title">
        <p class="eyebrow">KIRA · 漫画分享</p>
        <h1 id="share-title"><span>好故事，</span><span>分享给你。</span></h1>
        <p class="lede">一部想和你一起看的漫画。<br />打开 Kira，慢慢读。</p>
      </section>

      <section class="handoff" aria-labelledby="status-title">
        <div class="section-label"><span>阅读入口</span><span class="link-state" id="link-state">等待验证</span></div>
        <h2 id="status-title">先确认这条分享链接。</h2>
        <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true">页面需要 JavaScript 验证链接。若长时间没有变化，请刷新或改用系统浏览器。</p>
        <div class="actions">
          <button class="button button-primary" id="open-app" type="button" aria-describedby="status" disabled>
            在 Kira 中打开
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
          </button>
          <a class="button button-secondary" href="https://github.com/caolib/kira/releases" target="_blank" rel="noopener noreferrer">
            还没安装？下载 Kira
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M7 6h11v11" /></svg>
            <span class="sr-only">（GitHub Releases，在新标签页打开）</span>
          </a>
        </div>
        <a class="text-link home-route" id="invalid-home" href="/" hidden>先返回首页</a>
        <noscript>
          <p class="noscript-note">JavaScript 未启用，无法验证链接或尝试打开 App。请启用后刷新；你也可以先下载 Kira，或通过页首返回首页。</p>
        </noscript>
      </section>

      <aside class="browser-note" aria-labelledby="browser-title">
        <h2 id="browser-title">在微信、QQ 等内置浏览器里？</h2>
        <p>请从菜单选择用系统浏览器打开，再试一次。安装 Kira 后，也可以回到此页重新打开。</p>
      </aside>
    </div>
  </main>

  <footer class="shell">
    <div class="colophon"><p>Kira · 漫画与轻小说</p><p>把喜欢的故事，分享出去。</p></div>
  </footer>

  <script type="module">
    import { parseComicPathWord, buildComicDeepLink } from '/c/share-link.js';

    const status = document.getElementById('status');
    const title = document.getElementById('status-title');
    const state = document.getElementById('link-state');
    const openButton = document.getElementById('open-app');
    const deepLink = buildComicDeepLink(parseComicPathWord(window.location));

    if (!deepLink) {
      title.textContent = '这条分享链接无效。';
      state.textContent = '链接无效';
      status.textContent = '请回到原分享处，重新获取完整链接后再试。也可以先返回首页。';
      document.getElementById('invalid-home').hidden = false;
    } else {
      title.textContent = '在 Kira 里，接着看。';
      state.textContent = '链接已就绪';
      openButton.disabled = false;

      function attemptOpen() {
        status.textContent = '已尝试打开 Kira。若未跳转，可以点击下方按钮再试，或改用系统浏览器。';
        try {
          window.location.href = deepLink;
        } catch {
          status.textContent = '浏览器未能发起打开请求。请改用系统浏览器，或先下载 Kira 再试。';
        }
      }

      openButton.addEventListener('click', attemptOpen);
      // 每次加载只自动尝试一次；不检测安装，也不在返回页面时重复唤起。
      attemptOpen();
    }
  </script>
</body>
</html>
